[package]
name = "patchweft-control"
# Fixed: the version is part of the runner's symbol hashes, so bumping it changes the runner's
# bytes. Never bump it for a release.
version = "0.0.0"
edition = "2024"
description = "Control-file types and job identity shared by the Patchweft scheduler and runner"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip on both sides, so the runner parses a claim's floats as the scheduler does,
# whichever crate graph it is built in.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
