[package]
name = "patchweft"
version = "0.1.0"
edition = "2024"
description = "Shared source and execution for coding agents"
license = "MIT"
repository = "https://github.com/rawritude/patchweft"
readme = "README.md"
keywords = ["agents", "collaboration", "build", "testing"]
categories = ["development-tools"]

[[bin]]
name = "patchweft"
path = "src/main.rs"

# The runner (`runner/`) is its own workspace with its own lockfile, built only by
# scripts/build-runner.sh. Its member `runner/control` holds the types both binaries share.
[workspace]
exclude = ["runner"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-core = "0.3"
http-body-util = "0.1"
libc = "0.2"
patchweft-control = { path = "runner/control" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

# Every launch verifies the runner and tool bytes by SHA-256; unoptimized, hashing the debug
# binary takes seconds per launch.
[profile.dev.package.sha2]
opt-level = 3
